<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2D25" />
      <stop offset="50%" stop-color="#16423C" />
      <stop offset="100%" stop-color="#1E544A" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Decorative Border -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#2A6B5E" stroke-width="4" stroke-dasharray="8 8" opacity="0.6"/>
  <circle cx="256" cy="256" r="204" fill="none" stroke="url(#goldGrad)" stroke-width="3" opacity="0.85"/>

  <!-- Inner Badge Container -->
  <circle cx="256" cy="256" r="185" fill="#0C241D" filter="url(#glow)"/>

  <!-- Central Academic Emblem & Vokasi Leaf/Gear Motif -->
  <!-- Stylized Open Book -->
  <path d="M 170 285 Q 256 265 256 320 Q 256 265 342 285 L 342 355 Q 256 335 256 390 Q 256 335 170 355 Z" fill="#F8FAFC" opacity="0.95"/>
  <path d="M 256 320 L 256 390" stroke="#16423C" stroke-width="3"/>

  <!-- Central Sprout / Growth Symbol -->
  <path d="M 256 260 C 256 215 210 180 190 195 C 180 230 215 260 256 260 Z" fill="url(#emeraldGrad)"/>
  <path d="M 256 260 C 256 215 302 180 322 195 C 332 230 297 260 256 260 Z" fill="url(#emeraldGrad)"/>
  <path d="M 256 270 L 256 160" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Star on Top -->
  <polygon points="256,130 262,148 280,148 266,158 271,176 256,165 241,176 246,158 232,148 250,148" fill="url(#goldGrad)"/>

  <!-- Text: SMKN 1 -->
  <text x="256" y="112" font-family="sans-serif" font-weight="900" font-size="28" fill="#FDE68A" text-anchor="middle" letter-spacing="4">SMKN 1</text>
  <!-- Text: PAKUAN RATU -->
  <text x="256" y="425" font-family="sans-serif" font-weight="800" font-size="22" fill="#E2E8F0" text-anchor="middle" letter-spacing="3">PAKUAN RATU</text>
  <text x="256" y="445" font-family="sans-serif" font-weight="600" font-size="13" fill="#34D399" text-anchor="middle" letter-spacing="2">WAY KANAN - LAMPUNG</text>
</svg>